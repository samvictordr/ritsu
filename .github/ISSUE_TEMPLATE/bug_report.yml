name: Bug report
description: Something is broken or wrong.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Ritsu. Never paste tokens, passwords or your friend code here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Stats tab
        2. Switch mode to mania
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where in the app?
      options:
        - Sign in
        - Home
        - Stats
        - Plays
        - Maps / beatmap details
        - Social / friends
        - Settings
        - Other
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options:
        - osu!
        - taiko
        - catch
        - mania
        - Not mode-specific
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in TestFlight under Ritsu, e.g. 3.0.0 (3).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPhone 13, iOS 26.1
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recordings
      description: Drag files here. Crop out anything private.
